# UKSL Translator — local development compose file.
# NOTE: Populated in Phase 2 (backend) / Phase 3 (frontend) once Dockerfiles exist.
# Kept intentionally minimal until the local (non-docker) pipeline works end to end,
# per project rule: don't complicate deployment before the core system runs.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
